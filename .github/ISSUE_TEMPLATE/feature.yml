name: Feature proposal
description: Propose a focused improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable result would solve the problem?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing tools, workarounds, or a reason this belongs in Valtors.
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What should this proposal explicitly not attempt?
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I will wait for maintainer agreement before opening a large implementation PR.
          required: true
